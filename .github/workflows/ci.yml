name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run syntax, ShellCheck, command-surface, and secret checks
        run: REQUIRE_SHELLCHECK=1 ./scripts/test.sh
